
name: Update Eglantine Nix Flake

on:
  schedule:
    # Check every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-eglantine-flake
  cancel-in-progress: false

jobs:
  update-flake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest Eglantine release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: eglantine-nix-updater" \
            https://api.github.com/repos/Djihads80/Eglantine/releases/latest)

          tag=$(echo "$release" | jq -er '.tag_name')

          asset_url=$(echo "$release" | jq -er '
            [.assets[]
              | select(.name | test("linux-x86_64.*\\.AppImage$"; "i"))
            ][0].browser_download_url
          ')

          version="${tag#build-}"

          echo "Release: $tag"
          echo "Version: $version"
          echo "AppImage: $asset_url"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$asset_url" >> "$GITHUB_OUTPUT"

          current_version=$(sed -nE \
            's/^[[:space:]]*version = "([^"]+)";/\1/p' \
            flake.nix | head -n1)

          if [ "$version" = "$current_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New release detected!"
          fi

      - name: Calculate AppImage hash
        if: steps.release.outputs.changed == 'true'
        id: hash
        shell: bash
        env:
          APPIMAGE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail

          hash=$(nix-prefetch-url \
            --type sha256 \
            "$APPIMAGE_URL")

          sri_hash=$(nix hash to-sri \
            --type sha256 \
            "$hash")

          echo "hash=$sri_hash" >> "$GITHUB_OUTPUT"

          echo "SHA-256: $sri_hash"

      - name: Update flake.nix
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          APPIMAGE_URL: ${{ steps.release.outputs.url }}
          APPIMAGE_HASH: ${{ steps.hash.outputs.hash }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("flake.nix")
          content = path.read_text()

          replacements = [
              (
                  r'(?m)^(\s*version\s*=\s*)"[^"]+";',
                  f'\\g<1>"{os.environ["VERSION"]}";'
              ),
              (
                  r'(?m)^(\s*url\s*=\s*)"[^"]+";',
                  f'\\g<1>"{os.environ["APPIMAGE_URL"]}";'
              ),
              (
                  r'(?m)^(\s*hash\s*=\s*)"[^"]+";',
                  f'\\g<1>"{os.environ["APPIMAGE_HASH"]}";'
              ),
          ]

          for pattern, replacement in replacements:
              content, count = re.subn(pattern, replacement, content)

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match for {pattern}, got {count}"
                  )

          path.write_text(content)
          PY

      - name: Build and verify package
        if: steps.release.outputs.changed == 'true'
        run: nix build .#default --no-link

      - name: Commit updated flake
        if: steps.release.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- flake.nix; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flake.nix

          git commit -m "chore: update Eglantine to build-${{ steps.release.outputs.version }}"

          git push

